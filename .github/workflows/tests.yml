name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

  unit:
    name: Unit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
      JWT_SECRET: ci-test-secret
    strategy:
      fail-fast: false
      matrix:
        suite:
          - auth
          - coach-assignment
          - workout-exercise-logs
          - workout-maintenance
          - checkin
          - checkin-questions-gate
          - messaging-validation
          - messaging-authorization
          - realtime-token
          - ably-publisher
          - outbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit suite — ${{ matrix.suite }}
        run: npm test -- tests/unit/${{ matrix.suite }}.test.ts -- --forceExit

  integration:
    name: Integration (auth + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athletica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athletica_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Integration tests
        run: npm test -- tests/integration -- --forceExit
